name: Independent URL source audit
on:
  workflow_dispatch:
  push:
    branches: [feature/real-external-audit-2026, feature/paired-url-shape-diagnostic]
    paths:
      - '.github/workflows/external-evaluation.yml'
      - 'scripts/evaluate_external.py'
      - 'tests/test_external_audit.py'
      - 'requirements-dev.txt'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests before evaluation
        run: PYTHONPATH=src pytest -q
      - name: Download original UCI source, train model and verify metadata
        run: |
          python scripts/download_uci.py
          python scripts/train_model.py --csv data/phiusiil_urls.csv
          python scripts/verify_report.py models/url_model_meta.json
      - name: Acquire independent public snapshots
        run: |
          mkdir -p data/external
          curl --fail --location --silent --show-error --max-time 90 --max-filesize 20000000 \
            --user-agent "PhishingRiskResearch/1.0" \
            "https://data.phishtank.com/data/online-valid.csv.gz" -o data/external/online-valid.csv.gz
          curl --fail --location --silent --show-error --max-time 90 --max-filesize 20000000 \
            --user-agent "PhishingRiskResearch/1.0" \
            "https://tranco-list.eu/top-1m.csv.zip" -o data/external/tranco.zip
          test -s data/external/online-valid.csv.gz
          test -s data/external/tranco.zip
      - name: Evaluate and summarize source-separated URLs (no URL visits)
        run: |
          PYTHONPATH=src python scripts/evaluate_external.py \
            --uci-csv data/phiusiil_urls.csv \
            --phishing-csv data/external/online-valid.csv.gz \
            --popular-zip data/external/tranco.zip \
            --sample 2000 --out reports/external_audit.json
      - name: Publish metric-only artifact even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-url-audit-v2
          path: |
            reports/external_audit.json
            models/url_model_meta.json
          if-no-files-found: warn
          retention-days: 14
