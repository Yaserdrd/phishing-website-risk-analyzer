name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.10"
            lock: requirements/py310.lock
          - python-version: "3.11"
            lock: requirements/py311.lock
          - python-version: "3.12"
            lock: requirements/py312.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Check dependency lock identities
        run: python scripts/lock_dependencies.py --check
      - name: Install requirements
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ${{ matrix.lock }}
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        run: PYTHONPATH=src pytest -q
      - name: Compile sources
        run: python -m compileall -q src app.py scripts
